services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    pull_policy: build
    image: students-manager-backend:local
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800000}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/students_manager?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SM4_KEY_BASE64: ${SM4_KEY_BASE64:?Set SM4_KEY_BASE64 in docker/.env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health/check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    pull_policy: build
    image: students-manager-frontend:local
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.30.5-alpine3.24
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: students_manager
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    volumes:
      - students-manager-mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  app-network:
    name: students-manager-network

volumes:
  students-manager-mysql-data:
