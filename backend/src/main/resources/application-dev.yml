server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 5000
    accept-count: 100
    max-connections: 10000

spring:
  flyway:
    # Local schema is always created by Flyway; seed-dev.sql only adds demo records.
    baseline-on-migrate: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/students_manager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${SPRING_DATASOURCE_USERNAME:students_manager_app}
    password: ${SPRING_DATASOURCE_PASSWORD:xiaoer}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      connection-test-query: SELECT 1

security:
  sm4:
    # 本地开发默认值与 backend/.env.local.example 保持一致；部署环境请显式注入 SM4_KEY_BASE64。
    key-base64: ${SM4_KEY_BASE64:XYsAyiFWIFDxsd1mfLdbnw==}

jwt:
  # 本地开发兜底值；生产环境必须通过 JWT_SECRET 注入独立随机密钥。
  secret: ${JWT_SECRET:students-manager-local-development-secret-change-before-deployment}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.studentsmanager.model.entity
  configuration:
    map-underscore-to-camel-case: true
    # Route MyBatis logs through Logback; do not print SQL bind values directly to stdout.
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
