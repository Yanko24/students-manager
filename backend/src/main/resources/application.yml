spring:
  profiles:
    active: dev # 本地开发默认；Docker Compose 显式指定 prod
  application:
    name: students-manager
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 1
    baseline-on-migrate: false
  # 跨域配置
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

# JWT配置
jwt:
  secret: your-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm
  expiration: ${JWT_EXPIRATION:1800000} # 默认30分钟，单位毫秒
  header: Authorization
  prefix: "Bearer "

security:
  sm4:
    key-base64: ${SM4_KEY_BASE64:}

# 文件上传配置
file:
  upload:
    path: uploads/
    max-size: 10MB
    allowed-types: image/jpeg,image/png,image/gif
